      /* ── SSE stream factory ──────────────────────────────────────────── */
      function makeTextSseStream(fullText, chunkSize, charDelay) {
        const encoder = new TextEncoder();
        return new ReadableStream({
          async start(controller) {
            let i = 0;
            while (i < fullText.length) {
              await new Promise(r => setTimeout(r, charDelay));
              const chunk = fullText.slice(i, i + chunkSize);
              i += chunkSize;
              controller.enqueue(encoder.encode('data: ' + JSON.stringify({content: chunk}) + '\n\n'));
            }
            await new Promise(r => setTimeout(r, 80));
            controller.enqueue(encoder.encode('data: [DONE]\n\n'));
            controller.close();
          }
        });
      }

      function makeEventSseStream(events) {
        const encoder = new TextEncoder();
        return new ReadableStream({
          async start(controller) {
            for (const item of events) {
              await new Promise(r => setTimeout(r, item.delay || 200));
              controller.enqueue(encoder.encode('data: ' + JSON.stringify(item.e) + '\n\n'));
            }
            await new Promise(r => setTimeout(r, 100));
            controller.enqueue(encoder.encode('data: [DONE]\n\n'));
            controller.close();
          }
        });
      }

      window.fetch = async function(input, init) {
        const url = (typeof input === 'string' ? input : input.url) || '';
        const path = url.replace(/^https?:\/\/[^/]+/, '');

        // Status endpoint
        if (path === '/v1/status' || path.endsWith('/v1/status')) {
          return new Response(JSON.stringify({
            genos: { configured: false, hasToken: false, isExpired: false },
            kg: { reachable: false, uri: 'bolt://demo:7688' },
            service: { port: 3939, env: 'demo' }
          }), { status: 200, headers: { 'Content-Type': 'application/json' } });
        }

        // Audience Agent stream
        if (path.endsWith('/v1/agent/invoke/stream')) {
          const body = init?.body ? JSON.parse(init.body) : {};
          const msgs = body.messages || [];
          const lastUser = [...msgs].reverse().find(m => m.role === 'user');
          const isFollowUp = msgs.length > 2;
          const text = isFollowUp ? AUDIENCE_FOLLOWUP_RESPONSE : AUDIENCE_RESPONSE;
          return new Response(makeTextSseStream(text, 6, 18), {
            status: 200,
            headers: { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache' }
          });
        }

        // Creative Agent stream
        if (path.endsWith('/v1/creative/run')) {
          return new Response(makeEventSseStream(CREATIVE_EVENTS), {
            status: 200,
            headers: { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache' }
          });
        }

        // IXP Agent stream
        if (path.endsWith('/v1/ixp/run')) {
          return new Response(makeEventSseStream(IXP_EVENTS), {
            status: 200,
            headers: { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache' }
          });
        }

        // E2E QA Agent stream
        if (path.endsWith('/v1/e2e-qa/send-email')) {
          return new Response(makeEventSseStream(E2E_EVENTS), {
            status: 200,
            headers: { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache' }
          });
        }

        return _origFetch(input, init);
      };
