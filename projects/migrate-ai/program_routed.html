let filtered=[], sortCol='canvas', sortDir=-1;

function init(){
  populateSelect('f-geo',[...new Set(ALL.map(c=>c.Geo||'(none)'))].sort());
  populateSelect('f-cat',[...new Set(ALL.map(c=>c.MOps_categorization).filter(Boolean))].sort());
  document.querySelectorAll('#filters select, #filters input').forEach(el=>el.addEventListener('input',apply));
  document.getElementById('reset-btn').addEventListener('click',()=>{
    document.querySelectorAll('#filters select').forEach(s=>s.selectedIndex=0);
    document.getElementById('search-inp').value=''; apply();
  });
  apply();
}

function populateSelect(id,vals){
  const sel=document.getElementById(id);
  vals.forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;sel.appendChild(o);});
}

function apply(){
  const q=document.getElementById('search-inp').value.trim().toUpperCase();
  const geo=document.getElementById('f-geo').value;
  const cat=document.getElementById('f-cat').value;
  const fc=document.getElementById('f-canvas').value;
  const fu=document.getElementById('f-up').value;
  const fd=document.getElementById('f-dep').value;
  const sends=document.getElementById('f-sends').value;
  const loop=document.getElementById('f-loop').value;
  filtered=ALL.filter(c=>{
    if(q&&!c.name?.toUpperCase().includes(q)&&!String(c.eloqua_id).includes(q))return false;
    if(geo&&(c.Geo||'(none)')!==geo)return false;
    if(cat&&c.MOps_categorization!==cat)return false;
    if(fc&&c.canvas!=fc)return false;
    if(fu&&c.upstream!=fu)return false;
    if(fd&&c.dependency!=fd)return false;
    if(sends==='yes'&&!(c.total_email_sends_2m>0))return false;
    if(sends==='no'&&c.total_email_sends_2m>0)return false;
    if(loop==='yes'&&!((c.scc_size||1)>1))return false;
    if(loop==='no'&&(c.scc_size||1)>1)return false;
    return true;
  });
  renderSummary(); renderTable();
}

function renderSummary(){
  const n=filtered.length;
  document.getElementById('h-showing').textContent=n;
  document.getElementById('h-total').textContent=ALL.length;
  const avgC=n?(filtered.reduce((s,c)=>s+c.canvas,0)/n).toFixed(1):'-';
  const avgU=n?(filtered.reduce((s,c)=>s+(c.upstream||0),0)/n).toFixed(1):'-';
  const inLoop=filtered.filter(c=>(c.scc_size||1)>1).length;
  const dep5=filtered.filter(c=>c.dependency===5).length;
  const totalSends=filtered.reduce((s,c)=>s+(c.total_email_sends_2m||0),0);
  const withSends=filtered.filter(c=>c.total_email_sends_2m>0).length;
  document.getElementById('summary').innerHTML=`
    <div class="sc"><div class="lbl">Campaigns</div><div class="val" style="color:var(--orange)">${n}</div><div class="sub">program-routed</div></div>
    <div class="sc"><div class="lbl">Avg Canvas</div><div class="val" style="color:${COLORS[Math.round(avgC)]}">${avgC}</div><div class="sub">complexity (1–5)</div></div>
    <div class="sc"><div class="lbl">Avg Upstream</div><div class="val" style="color:${COLORS[Math.round(avgU)]}">${avgU}</div><div class="sub">chain complexity</div></div>
    <div class="sc"><div class="lbl">In SCC Loops</div><div class="val" style="color:var(--red)">${inLoop}</div><div class="sub">recursive routing</div></div>
    <div class="sc"><div class="lbl">Deeply Entangled</div><div class="val" style="color:var(--red)">${dep5}</div><div class="sub">dependency score 5</div></div>
    <div class="sc"><div class="lbl">With Sends</div><div class="val" style="color:var(--green)">${withSends}</div><div class="sub">${totalSends>=1e6?(totalSends/1e6).toFixed(1)+'M':totalSends>=1000?(totalSends/1000).toFixed(0)+'K':totalSends} total</div></div>
  `;
}

function renderTable(){
  filtered.sort((a,b)=>{
    let va=a[sortCol],vb=b[sortCol];
    if(va==null)va=sortDir>0?Infinity:-Infinity;
    if(vb==null)vb=sortDir>0?Infinity:-Infinity;
    if(typeof va==='string')return sortDir*va.localeCompare(vb);
    return sortDir*(va-vb);
  });
  const cols=[
    {key:'name',label:'Campaign Name',w:'280px'},
    {key:'Geo',label:'Geo',w:'80px'},
    {key:'MOps_categorization',label:'Category',w:'140px'},
    {key:'canvas',label:'Canvas',w:'60px'},
    {key:'upstream',label:'Upstream',w:'65px'},
    {key:'dependency',label:'Depend.',w:'60px'},
    {key:'max_chain_depth',label:'Chain Depth',w:'72px'},
    {key:'inst_co_migration_count',label:'Co-migrate #',w:'75px'},
    {key:'total_email_sends_2m',label:'Sends 12m',w:'80px'},
  ];
  document.querySelector('#tbl thead').innerHTML='<tr>'+cols.map(c=>{
    const arr=sortCol===c.key?`<span class="sort-arrow">${sortDir>0?'▲':'▼'}</span>`:'';
    return `<th data-col="${c.key}" style="width:${c.w}">${c.label}${arr}</th>`;
  }).join('')+'</tr>';
  document.querySelectorAll('#tbl th').forEach(th=>th.addEventListener('click',()=>{
    const col=th.dataset.col;
    if(sortCol===col)sortDir*=-1; else{sortCol=col;sortDir=col==='name'?1:-1;}
    renderTable();
  }));
  const COLORS2=['','#059669','#2563EB','#B45309','#D97706','#DC2626'];
  document.querySelector('#tbl tbody').innerHTML=filtered.map(c=>{
    let entryLabel='';
    if(c.input_count>0&&c.seg_count>0)entryLabel='Input + Segment';
    else if(c.input_count>0)entryLabel='Program Input';
    else if(c.feeder_count>0)entryLabel='Cloud Feeder';
    else entryLabel='No entry';
    const loopBadge=(c.scc_size||1)>1?`<span class="loop-badge">↺ Loop (SCC ${c.scc_size})</span>`:'';
    const depBadge=`<span class="dep-badge dep-${c.dependency||1}">${DEP_LABELS[c.dependency||1]}</span>`;
    const sends=c.total_email_sends_2m>0
      ?`<span class="sends-pos">${c.total_email_sends_2m.toLocaleString()}</span>`
      :'<span style="color:var(--text-light)">—</span>';
    return `<tr data-id="${c.eloqua_id}" style="cursor:pointer">
      <td class="name-cell">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name||c.eloqua_id}</div>
        <div style="margin-top:3px"><span class="entry-badge">${entryLabel}</span>${loopBadge}</div>
        <div style="margin-top:2px">${depBadge}</div>
      </td>
      <td class="geo-cell">${c.Geo||'-'}</td>
      <td class="cat-cell">${c.MOps_categorization||'<span style="color:var(--text-light)">—</span>'}</td>
      <td style="text-align:center"><span class="pill pill-${c.canvas}">${c.canvas}</span></td>
      <td style="text-align:center"><span class="pill pill-${c.upstream||1}">${c.upstream||'-'}</span></td>
      <td style="text-align:center"><span class="pill pill-${c.dependency||1}">${c.dependency||'-'}</span></td>
      <td style="text-align:center;color:var(--text-muted)">${c.max_chain_depth??'-'}</td>
      <td style="text-align:center;color:${(c.inst_co_migration_count||0)>10?'var(--orange)':'var(--text-muted)'}">${c.inst_co_migration_count??'-'}</td>
      <td class="sends-cell">${sends}</td>
    </tr>`;
  }).join('');
  document.querySelectorAll('#tbl tbody tr').forEach(tr=>tr.addEventListener('click',()=>{
    const c=filtered.find(x=>String(x.eloqua_id)===tr.dataset.id);
    if(c) showDetail(c);
  }));
}

function showDetail(c){
  let entryLabel='';
  if(c.input_count>0&&c.seg_count>0)entryLabel='Program Input + Segment';
  else if(c.input_count>0)entryLabel='Program Input only';
  else if(c.feeder_count>0)entryLabel='Cloud Feeder';
  else entryLabel='No entry point detected';
  const challenges=P_KEYS.map((k,i)=>`<span class="c-tag ${c[k]?'c-on':'c-off'}">${P_LABELS[i]}</span>`).join('');
  document.getElementById('panel-content').innerHTML=`
    <div class="p-meta" style="margin-bottom:4px">${c.Geo||'-'} · ID: ${c.eloqua_id} · ${c.current_status||'Unknown'}</div>
    <div class="p-name">${c.name}</div>
    <div class="p-meta">${c.MOps_categorization||'Uncategorized'}</div>
    <div class="p-scores">
      <div class="p-score"><div class="pv" style="color:${COLORS[c.canvas]}">${c.canvas}</div><div class="pl">Canvas</div></div>
      <div class="p-score"><div class="pv" style="color:${COLORS[c.upstream||1]}">${c.upstream||'-'}</div><div class="pl">Upstream</div></div>
      <div class="p-score"><div class="pv" style="color:${COLORS[c.dependency||1]}">${c.dependency||'-'}</div><div class="pl">Dependency</div></div>
    </div>
    <div class="p-section">
      <h4>Entry Type</h4>
      <div class="p-row"><span class="k">Source</span><span class="v" style="color:var(--purple)">${entryLabel}</span></div>
      <div class="p-row"><span class="k">Program inputs</span><span class="v">${c.input_count||0}</span></div>
      <div class="p-row"><span class="k">Segments</span><span class="v">${c.seg_count||0}</span></div>
      <div class="p-row"><span class="k">Cloud feeders</span><span class="v">${c.feeder_count||0}</span></div>
    </div>
    <div class="p-section">
      <h4>Upstream Chain</h4>
      <div class="p-row"><span class="k">Total upstream nodes</span><span class="v">${c.total_upstream_count??'-'}</span></div>
      <div class="p-row"><span class="k">Max chain depth</span><span class="v">${c.max_chain_depth??'-'}</span></div>
      <div class="p-row"><span class="k">Upstream programs</span><span class="v">${c.upstream_program_count??'-'}</span></div>
      <div class="p-row"><span class="k">CDO listeners in chain</span><span class="v">${c.cdo_listener_count??'-'}</span></div>
      <div class="p-row"><span class="k">Root sources</span><span class="v">${c.root_source_count??'-'}</span></div>
    </div>
    <div class="p-section">
      <h4>Dependency</h4>
      <div class="p-row"><span class="k">Status</span><span class="v" style="color:${COLORS[c.dependency||1]}">${DEP_LABELS[c.dependency||1]}</span></div>
      <div class="p-row"><span class="k">Co-migration campaigns</span><span class="v" style="color:${(c.inst_co_migration_count||0)>10?'var(--orange)':'inherit'}">${c.inst_co_migration_count??'-'}</span></div>
      <div class="p-row"><span class="k">Component total nodes</span><span class="v">${c.comp_total??'-'}</span></div>
      <div class="p-row"><span class="k">SCC loop size</span><span class="v" style="color:${(c.scc_size||1)>1?'var(--red)':'var(--text-light)'}">${(c.scc_size||1)>1?c.scc_size:'-'}</span></div>
    </div>
    <div class="p-section">
      <h4>Canvas Metrics</h4>
      <div class="p-row"><span class="k">Total elements</span><span class="v">${c.total_elements||'-'}</span></div>
      <div class="p-row"><span class="k">Emails</span><span class="v">${c.emails||0}</span></div>
    </div>
    <div class="p-section">
      <h4>Challenges Triggered (${c.challenges_triggered||0}/12)</h4>
      <div class="c-tags">${challenges}</div>
    </div>
    <div class="p-section">
      <h4>Send Activity</h4>
      <div class="p-row"><span class="k">Total sends (12m)</span><span class="v" style="color:${c.total_email_sends_2m>0?'var(--green)':'var(--text-light)'}">${c.total_email_sends_2m?c.total_email_sends_2m.toLocaleString():'None'}</span></div>
    </div>
  `;
  document.getElementById('panel').classList.add('open');
}

document.getElementById('panel-close').addEventListener('click',()=>document.getElementById('panel').classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('panel').classList.remove('open');});
init();
</script>
