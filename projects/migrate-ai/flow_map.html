const PROD_COLORS = {
  qbo: '#2563EB', qboav: '#7C3AED', qbopr: '#059669', qbtime: '#D97706',
  controller: '#DC2626', cdo: '#9CA3AF', epop: '#0891B2', ixp: '#E5E7EB',
  other: '#6B7280'
};
const DEPTH_COLORS = ['#2563EB','#0891B2','#059669','#D97706','#DC2626','#7C3AED','#6B7280'];

let nodeMap = {};
FLOW_DATA.nodes.forEach(n => nodeMap[n.id] = n);

let svg, g, zoom, nodes, edges;
let w, h;
let showLabels = true;
let colorMode = 'type', layoutMode = 'depth', filterMode = 'all';
let tx = 0, ty = 0, scale = 1;
let selectedId = null;

function getColor(n) {
  if (colorMode === 'type') {
    if (n.central) return '#DC2626';
    if (n.is_seed) return '#7C3AED';
    if (n.ntype === 'cdo') return '#9CA3AF';
    if (n.ntype === 'program') return '#2563EB';
    return '#059669';
  }
  if (colorMode === 'prod') return PROD_COLORS[n.prod] || '#9CA3AF';
  if (colorMode === 'depth') return DEPTH_COLORS[Math.min(n.depth, 6)];
  if (colorMode === 'loop') return (n.scc_size > 1) ? '#DC2626' : '#E5E7EB';
  if (colorMode === 'role') {
    if (n.is_root) return '#059669';
    if (n.is_terminal) return '#DC2626';
    if (n.is_seed) return '#7C3AED';
    return '#6B7280';
  }
  return '#9CA3AF';
}

function getRadius(n) {
  if (n.central) return 18;
  if (n.is_seed) return 11;
  const pr = n.pagerank || 0;
  return Math.max(5, Math.min(14, 5 + pr * 500));
}

function getFilteredNodes() {
  if (filterMode === 'seed') return FLOW_DATA.nodes.filter(n => n.is_seed || n.central);
  if (filterMode === 'loop') return FLOW_DATA.nodes.filter(n => n.scc_size > 1);
  return FLOW_DATA.nodes;
}

function getFilteredEdges(visNodeIds) {
  const idSet = new Set(visNodeIds);
  return FLOW_DATA.edges.filter(e => idSet.has(e.s) && idSet.has(e.t));
}

function computePositions(nodeSubset) {
  if (layoutMode === 'depth') {
    const byDepth = {};
    nodeSubset.forEach(n => {
      (byDepth[n.depth] = byDepth[n.depth] || []).push(n);
    });
    const depths = Object.keys(byDepth).map(Number).sort((a,b) => a-b);
    const depthSpacing = Math.min(180, (h - 80) / Math.max(depths.length - 1, 1));
    const pos = {};
    depths.forEach((d, di) => {
      const group = byDepth[d];
      const spread = Math.min(w - 80, group.length * 90);
      const startX = w/2 - spread/2 + 45;
      const y = 40 + di * depthSpacing;
      group.forEach((n, i) => {
        pos[n.id] = { x: startX + i * (spread / Math.max(group.length - 1, 1)), y };
      });
    });
    return pos;
  } else {
    // Simple force-lite using pagerank for rough sizing, jitter for spread
    const pos = {};
    nodeSubset.forEach((n, i) => {
      const angle = (i / nodeSubset.length) * Math.PI * 2;
      const r = 120 + n.depth * 80;
      pos[n.id] = { x: w/2 + r * Math.cos(angle), y: h/2 + r * Math.sin(angle) };
    });
    return pos;
  }
}

function init() {
  const svgEl = document.getElementById('graph');
  w = svgEl.clientWidth || 1200;
  h = svgEl.clientHeight || 700;

  svg = d3sel(svgEl);
  g = createG(svgEl);

  // Zoom behavior
  let isDragging = false, startX, startY, startTX, startTY;
  svgEl.addEventListener('mousedown', e => {
    if (e.target !== svgEl && e.target !== g) return;
    isDragging = true; startX = e.clientX; startY = e.clientY; startTX = tx; startTY = ty;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    tx = startTX + (e.clientX - startX); ty = startTY + (e.clientY - startY);
    applyTransform();
  });
  window.addEventListener('mouseup', () => isDragging = false);
  svgEl.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.91;
    const rect = svgEl.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    tx = cx - (cx - tx) * factor; ty = cy - (cy - ty) * factor; scale *= factor;
    applyTransform();
  }, { passive: false });

  document.getElementById('zoom-in').onclick = () => { scale *= 1.2; applyTransform(); };
  document.getElementById('zoom-out').onclick = () => { scale /= 1.2; applyTransform(); };
  document.getElementById('zoom-fit').onclick = fitView;
  document.getElementById('btn-reset').onclick = () => { tx=0; ty=0; scale=1; applyTransform(); render(); };
  document.getElementById('btn-labels').onclick = () => {
    showLabels = !showLabels;
    document.getElementById('btn-labels').textContent = `Labels: ${showLabels ? 'Short' : 'Off'}`;
    document.querySelectorAll('.node-label').forEach(l => l.style.display = showLabels ? '' : 'none');
  };
  document.getElementById('color-mode').onchange = e => { colorMode = e.target.value; render(); };
  document.getElementById('layout-mode').onchange = e => { layoutMode = e.target.value; render(); };
  document.getElementById('filter-mode').onchange = e => { filterMode = e.target.value; render(); };
  document.getElementById('panel-close').onclick = () => {
    document.getElementById('panel').classList.remove('open');
    selectedId = null;
    updateSelection();
  };

  render();
  updateLegend();
}

function d3sel(el) { return { el, _g: null }; }
function createG(svgEl) {
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('id','graph-g');
  svgEl.appendChild(g);
  return g;
}

function applyTransform() {
  g.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}

function render() {
  // Clear
  while (g.firstChild) g.removeChild(g.firstChild);
  
  const visNodes = getFilteredNodes();
  const visNodeIds = visNodes.map(n => n.id);
  const visEdges = getFilteredEdges(visNodeIds);
  const pos = computePositions(visNodes);

  // Detect loops for edge coloring
  const loopSets = new Set();
  visNodes.filter(n => n.scc_size > 1).forEach(n => loopSets.add(n.id));

  // Draw edges first
  const edgeG = document.createElementNS('http://www.w3.org/2000/svg','g');
  edgeG.setAttribute('class','edges-layer');
  g.appendChild(edgeG);

  visEdges.forEach(e => {
    const sp = pos[e.s], tp = pos[e.t];
    if (!sp || !tp) return;
    const isLoop = loopSets.has(e.s) && loopSets.has(e.t);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    
    // Curved path
    const dx = tp.x - sp.x, dy = tp.y - sp.y;
    const mx = (sp.x + tp.x) / 2 + dy * 0.15;
    const my = (sp.y + tp.y) / 2 - dx * 0.15;
    path.setAttribute('d', `M${sp.x},${sp.y} Q${mx},${my} ${tp.x},${tp.y}`);
    path.setAttribute('class', 'edge');
    path.setAttribute('stroke', isLoop ? '#FCA5A5' : '#D1D5DB');
    path.setAttribute('stroke-width', isLoop ? '1.5' : '0.8');
    path.setAttribute('stroke-opacity', '0.7');
    path.setAttribute('marker-end', isLoop ? 'url(#arrow-loop)' : 'url(#arrow)');
    edgeG.appendChild(path);
  });

  // Draw nodes
  const nodeG = document.createElementNS('http://www.w3.org/2000/svg','g');
  nodeG.setAttribute('class','nodes-layer');
  g.appendChild(nodeG);

  visNodes.forEach(n => {
    const p = pos[n.id];
    if (!p) return;
    const r = getRadius(n);
    const color = getColor(n);
    const grp = document.createElementNS('http://www.w3.org/2000/svg','g');
    grp.setAttribute('class','node');
    grp.setAttribute('data-id', n.id);
    grp.setAttribute('transform', `translate(${p.x},${p.y})`);
    grp.addEventListener('click', () => { selectedId = n.id; showPanel(n); updateSelection(); });

    if (n.ntype === 'program') {
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      const s = r * 1.6;
      rect.setAttribute('x', -s/2); rect.setAttribute('y', -s/2);
      rect.setAttribute('width', s); rect.setAttribute('height', s);
      rect.setAttribute('rx', 3);
      rect.setAttribute('fill', color);
      rect.setAttribute('stroke', n.central ? '#111827' : 'white');
      rect.setAttribute('stroke-width', n.central ? 2.5 : 1);
      grp.appendChild(rect);
    } else if (n.ntype === 'cdo') {
      const diamond = document.createElementNS('http://www.w3.org/2000/svg','polygon');
      const s = r * 1.5;
      diamond.setAttribute('points', `0,${-s} ${s},0 0,${s} ${-s},0`);
      diamond.setAttribute('fill', color);
      diamond.setAttribute('stroke','white');
      diamond.setAttribute('stroke-width','1');
      grp.appendChild(diamond);
    } else {
      const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('r', r);
      circle.setAttribute('fill', color);
      circle.setAttribute('stroke', n.central ? '#111827' : (n.is_seed ? '#6D28D9' : 'white'));
      circle.setAttribute('stroke-width', n.central ? 3 : (n.is_seed ? 2 : 1));
      grp.appendChild(circle);
    }

    // Label
    if (showLabels) {
      const labelLines = n.short.split(' · ');
      const line1 = labelLines[0] || '';
      const line2 = labelLines.slice(1).join(' · ');
      
      const text1 = document.createElementNS('http://www.w3.org/2000/svg','text');
      text1.setAttribute('class','node-label');
      text1.setAttribute('text-anchor','middle');
      text1.setAttribute('font-size', n.central ? '9' : '7.5');
      text1.setAttribute('font-weight', n.central || n.is_seed ? '700' : '400');
      text1.setAttribute('fill', '#111827');
      text1.setAttribute('dy', r + 10);
      text1.textContent = line1.length > 14 ? line1.slice(0,13)+'…' : line1;
      grp.appendChild(text1);

      if (line2) {
        const text2 = document.createElementNS('http://www.w3.org/2000/svg','text');
        text2.setAttribute('class','node-label');
        text2.setAttribute('text-anchor','middle');
        text2.setAttribute('font-size','6.5');
        text2.setAttribute('fill','#6B7280');
        text2.setAttribute('dy', r + 20);
        const shortLine2 = line2.length > 18 ? line2.slice(0,17)+'…' : line2;
        text2.textContent = shortLine2;
        grp.appendChild(text2);
      }
    }

    nodeG.appendChild(grp);
  });

  updateSelection();
  fitView();
}

function fitView() {
  const svgEl = document.getElementById('graph');
  w = svgEl.clientWidth; h = svgEl.clientHeight;
  
  // Get bounding box of g
  const allTexts = g.querySelectorAll('.node');
  if (!allTexts.length) return;
  
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  allTexts.forEach(el => {
    const t = el.getAttribute('transform') || '';
    const m = t.match(/translate\(([^,]+),([^)]+)\)/);
    if (m) {
      const x=parseFloat(m[1]), y=parseFloat(m[2]);
      minX=Math.min(minX,x); minY=Math.min(minY,y);
      maxX=Math.max(maxX,x); maxY=Math.max(maxY,y);
    }
  });
  
  const pad = 60;
  const bw = maxX - minX + pad*2, bh = maxY - minY + pad*2;
  scale = Math.min(w/bw, h/bh, 1.5);
  tx = w/2 - (minX + maxX)/2 * scale;
  ty = h/2 - (minY + maxY)/2 * scale;
  applyTransform();
}

function updateSelection() {
  document.querySelectorAll('.node').forEach(el => {
    const id = el.getAttribute('data-id');
    const shape = el.querySelector('circle, rect, polygon');
    if (shape) {
      shape.setAttribute('filter', id === selectedId ? 'url(#sel-glow)' : '');
    }
  });
}

function showPanel(n) {
  const sends = n.email_sends_2m;
  const TYPE_MAP = { campaign: 'Campaign', program: 'Program', cdo: 'CDO' };
  const PROD_LABELS = { qbo:'QBO',qboav:'QBOAV',qbopr:'QBO Payroll',qbtime:'QBTime',
    controller:'Controller',cdo:'CDO',epop:'EPOP',ixp:'IXP',other:'Other' };
  
  let badge='', badgeStyle='';
  if (n.central) { badge='★ CENTRAL'; badgeStyle='background:#FEE2E2;color:#DC2626;'; }
  else if (n.is_seed) { badge='Seed'; badgeStyle='background:#F5F3FF;color:#7C3AED;'; }
  else if (n.is_root) { badge='Root'; badgeStyle='background:#ECFDF5;color:#059669;'; }
  else if (n.is_terminal) { badge='Terminal'; badgeStyle='background:#FEF2F2;color:#DC2626;'; }
  else { badge=TYPE_MAP[n.ntype]||n.ntype; badgeStyle='background:#F3F4F6;color:#374151;'; }
  
  const loopHtml = n.scc_size > 1 ? `<span style="background:#FEE2E2;color:#DC2626;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:6px;">↺ Loop (SCC ${n.scc_size})</span>` : '';

  document.getElementById('panel-content').innerHTML = `
    <div style="margin-bottom:4px">
      <span class="p-type-badge" style="${badgeStyle}">${badge}</span>${loopHtml}
    </div>
    <div class="p-name">${n.name}</div>
    <div class="p-meta">ID: ${n.nid} · ${PROD_LABELS[n.prod]||n.prod} · Depth ${n.depth}</div>
    <div class="p-metrics">
      <div class="p-metric"><div class="mv" style="color:#2563EB">${n.inbound}</div><div class="ml">Inbound edges</div></div>
      <div class="p-metric"><div class="mv" style="color:#059669">${n.outbound}</div><div class="ml">Outbound edges</div></div>
      <div class="p-metric"><div class="mv" style="color:${n.scc_size>1?'#DC2626':'#9CA3AF'}">${n.scc_size}</div><div class="ml">SCC Size</div></div>
      <div class="p-metric"><div class="mv" style="color:#D97706">${(n.pagerank*1000).toFixed(2)}</div><div class="ml">PageRank ×10³</div></div>
    </div>
    <div class="p-section">
      <h4>Node Properties</h4>
      <div class="p-row"><span class="k">Type</span><span class="v">${TYPE_MAP[n.ntype]||n.ntype}</span></div>
      <div class="p-row"><span class="k">Product</span><span class="v">${PROD_LABELS[n.prod]||n.prod}</span></div>
      <div class="p-row"><span class="k">Depth Layer</span><span class="v">${n.depth}</span></div>
      <div class="p-row"><span class="k">Is Root</span><span class="v" style="color:${n.is_root?'#059669':'#9CA3AF'}">${n.is_root?'Yes':'No'}</span></div>
      <div class="p-row"><span class="k">Is Terminal</span><span class="v" style="color:${n.is_terminal?'#DC2626':'#9CA3AF'}">${n.is_terminal?'Yes':'No'}</span></div>
      <div class="p-row"><span class="k">Is Seed</span><span class="v" style="color:${n.is_seed?'#7C3AED':'#9CA3AF'}">${n.is_seed?'Yes (ELM5334 cluster)':'No'}</span></div>
      <div class="p-row"><span class="k">Is Central</span><span class="v" style="color:${n.central?'#DC2626':'#9CA3AF'}">${n.central?'Yes ★':'No'}</span></div>
    </div>
    <div class="p-section">
      <h4>Send Activity</h4>
      <div class="p-row"><span class="k">Email sends (12m)</span><span class="v" style="color:${sends>0?'#059669':'#9CA3AF'}">${sends?sends.toLocaleString():'None / N/A'}</span></div>
    </div>
  `;
  document.getElementById('panel').classList.add('open');
}

function updateLegend() {
  const items = document.getElementById('legend-items');
  items.innerHTML = '';
  
  const rows = [
    { color: '#DC2626', shape: 'circle', label: 'Central node (★)' },
    { color: '#7C3AED', shape: 'circle', label: 'ELM5334 seed cluster' },
    { color: '#2563EB', shape: 'square', label: 'Program (Eloqua)' },
    { color: '#059669', shape: 'circle', label: 'Campaign' },
    { color: '#9CA3AF', shape: 'diamond', label: 'CDO data object' },
    { color: '#FCA5A5', shape: 'line', label: 'Loop edge (SCC)' },
  ];
  
  rows.forEach(r => {
    const div = document.createElement('div');
    div.className = 'leg-row';
    if (r.shape === 'line') {
      const line = document.createElement('div');
      line.style.cssText = `width:22px;height:2px;background:${r.color};flex-shrink:0;`;
      div.appendChild(line);
    } else if (r.shape === 'square') {
      const sq = document.createElement('div');
      sq.className = 'leg-sq';
      sq.style.background = r.color;
      div.appendChild(sq);
    } else if (r.shape === 'diamond') {
      const sq = document.createElement('div');
      sq.className = 'leg-sq';
      sq.style.cssText = `background:${r.color};transform:rotate(45deg);border-radius:0;width:10px;height:10px;`;
      div.appendChild(sq);
    } else {
      const dot = document.createElement('div');
      dot.className = 'leg-dot';
      dot.style.background = r.color;
      div.appendChild(dot);
    }
    const span = document.createElement('span');
    span.textContent = r.label;
    div.appendChild(span);
    items.appendChild(div);
  });
}

window.addEventListener('load', init);
window.addEventListener('resize', () => { 
  const svgEl = document.getElementById('graph');
  w = svgEl.clientWidth; h = svgEl.clientHeight;
});
