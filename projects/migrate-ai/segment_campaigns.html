<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F9FAFB; --bg-card: #FFFFFF; --bg-subtle: #F3F4F6;
  --border: #E5E7EB; --border-dark: #D1D5DB;
  --text: #111827; --text-muted: #6B7280; --text-light: #9CA3AF;
  --accent: #2563EB; --accent-bg: #EFF6FF;
  --green: #059669; --green-bg: #ECFDF5;
  --amber: #B45309; --amber-bg: #FEF3C7;
  --orange: #D97706; --orange-bg: #FFF7ED;
  --red: #DC2626; --red-bg: #FEF2F2;
}
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
#header { position: sticky; top: 0; z-index: 100; background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; gap: 14px; }
.logo { font-size: 16px; font-weight: 800; text-decoration: none; letter-spacing: -.02em; }
.logo-m { color: var(--accent); }
.logo-iq { color: var(--green); }
.h-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.h-stats { margin-left: auto; font-size: 12px; color: var(--text-light); }
.h-stats b { color: var(--text); font-weight: 600; }
.back-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); text-decoration: none; padding: 5px 10px; border: 1px solid var(--border); border-radius: 7px; transition: all .15s; white-space: nowrap; }
.back-link:hover { background: var(--bg-subtle); color: var(--text); }
.h-sep { width: 1px; height: 18px; background: var(--border); }

#filters { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; position: sticky; top: 52px; z-index: 90; }
.fg { display: flex; flex-direction: column; gap: 3px; }
.fg label { font-size: 10px; color: var(--text-light); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.fg select, .fg input { background: var(--bg-card); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 5px 8px; font-size: 12px; font-family: inherit; min-width: 130px; -webkit-appearance: none; }
.fg select:focus, .fg input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
#reset-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 7px; color: var(--text-muted); padding: 5px 14px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; align-self: flex-end; transition: all .15s; }
#reset-btn:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }

#summary { padding: 14px 20px; display: flex; gap: 10px; flex-wrap: wrap; }
.sc { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; min-width: 140px; flex: 1; }
.sc .lbl { font-size: 10px; color: var(--text-light); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.sc .val { font-size: 26px; font-weight: 800; margin-top: 4px; letter-spacing: -.02em; }
.sc .sub { font-size: 11px; color: var(--text-light); margin-top: 2px; }

#table-container { padding: 0 20px 20px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
thead { position: sticky; top: 0; z-index: 50; }
th { background: var(--bg-subtle); padding: 10px; text-align: left; font-size: 10px; color: var(--text-light); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; font-weight: 600; }
th:hover { color: var(--text-muted); }
.sort-arrow { color: var(--accent); margin-left: 3px; }
td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--green-bg); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; min-width: 22px; text-align: center; }
.pill-1 { background: #DCFCE7; color: #059669; }
.pill-2 { background: #DBEAFE; color: #2563EB; }
.pill-3 { background: #FEF3C7; color: #B45309; }
.pill-4 { background: #FED7AA; color: #D97706; }
.pill-5 { background: #FEE2E2; color: #DC2626; }
.name-cell { max-width: 280px; color: var(--text); font-weight: 500; line-height: 1.45; }
.name-sub { font-size: 10.5px; color: var(--text-light); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 270px; }
.seg-badge { display: inline-block; background: var(--green-bg); color: var(--green); border: 1px solid #A7F3D0; border-radius: 4px; font-size: 10px; font-weight: 600; padding: 1px 6px; }
.geo-cell { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.cat-cell { font-size: 11px; color: var(--text-muted); }
.sends-cell { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); }
.sends-pos { color: var(--green); font-weight: 600; }

#panel { position: fixed; top: 0; right: -500px; width: 500px; height: 100vh; background: var(--bg-card); border-left: 1px solid var(--border); z-index: 200; overflow-y: auto; transition: right .3s ease; padding: 24px; box-shadow: -4px 0 30px rgba(0,0,0,.08); }
#panel.open { right: 0; }
#panel-close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-light); line-height: 1; padding: 4px; }
#panel-close:hover { color: var(--text); }
.p-name { font-size: 15px; font-weight: 700; color: var(--accent); word-break: break-word; margin-bottom: 4px; }
.p-meta { font-size: 11.5px; color: var(--text-light); margin-bottom: 14px; line-height: 1.7; }
.p-scores { display: flex; gap: 10px; margin-bottom: 18px; }
.p-score { flex: 1; text-align: center; padding: 12px 8px; background: var(--bg-subtle); border-radius: 8px; border: 1px solid var(--border); }
.p-score .pv { font-size: 26px; font-weight: 800; }
.p-score .pl { font-size: 9px; color: var(--text-light); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; font-weight: 600; }
.p-section { margin-bottom: 16px; }
.p-section h4 { font-size: 10px; color: var(--text-light); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px; font-weight: 600; }
.p-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; border-bottom: 1px solid var(--bg-subtle); }
.p-row .k { color: var(--text-muted); }
.p-row .v { color: var(--text); font-weight: 600; }
.seg-block { background: var(--green-bg); border: 1px solid #A7F3D0; border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.seg-name-item { font-size: 11.5px; color: var(--text); padding: 3px 0; border-bottom: 1px solid #D1FAE5; }
.seg-name-item:last-child { border-bottom: none; }
</style>

let filtered=[], sortCol='canvas', sortDir=-1;

function init() {
  populateSelect('f-geo',[...new Set(ALL.map(c=>c.Geo||'(none)'))].sort());
  populateSelect('f-cat',[...new Set(ALL.map(c=>c.MOps_categorization).filter(Boolean))].sort());
  document.querySelectorAll('#filters select, #filters input').forEach(el=>el.addEventListener('input',apply));
  document.getElementById('reset-btn').addEventListener('click',()=>{
    document.querySelectorAll('#filters select').forEach(s=>s.selectedIndex=0);
    document.getElementById('search-inp').value=''; apply();
  });
  apply();
}

function populateSelect(id,vals){
  const sel=document.getElementById(id);
  vals.forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;sel.appendChild(o);});
}

function apply(){
  const q=document.getElementById('search-inp').value.trim().toUpperCase();
  const geo=document.getElementById('f-geo').value;
  const cat=document.getElementById('f-cat').value;
  const fc=document.getElementById('f-canvas').value;
  const fd=document.getElementById('f-dep').value;
  const sends=document.getElementById('f-sends').value;
  filtered=ALL.filter(c=>{
    if(q&&!c.name?.toUpperCase().includes(q)&&!String(c.eloqua_id).includes(q))return false;
    if(geo&&(c.Geo||'(none)')!==geo)return false;
    if(cat&&c.MOps_categorization!==cat)return false;
    if(fc&&c.canvas!=fc)return false;
    if(fd&&c.dependency!=fd)return false;
    if(sends==='yes'&&!(c.total_email_sends_2m>0))return false;
    if(sends==='no'&&c.total_email_sends_2m>0)return false;
    return true;
  });
  renderSummary(); renderTable();
}

function renderSummary(){
  const n=filtered.length;
  document.getElementById('h-showing').textContent=n;
  document.getElementById('h-total').textContent=ALL.length;
  const avgC=n?(filtered.reduce((s,c)=>s+c.canvas,0)/n).toFixed(1):'-';
  const totalSends=filtered.reduce((s,c)=>s+(c.total_email_sends_2m||0),0);
  const withSends=filtered.filter(c=>c.total_email_sends_2m>0).length;
  const dep5=filtered.filter(c=>c.dependency===5).length;
  document.getElementById('summary').innerHTML=`
    <div class="sc"><div class="lbl">Campaigns</div><div class="val" style="color:var(--green)">${n}</div><div class="sub">segment-sourced</div></div>
    <div class="sc"><div class="lbl">Avg Canvas</div><div class="val" style="color:${COLORS[Math.round(avgC)]}">${avgC}</div><div class="sub">complexity (1–5)</div></div>
    <div class="sc"><div class="lbl">Deeply Entangled</div><div class="val" style="color:var(--red)">${dep5}</div><div class="sub">dependency score 5</div></div>
    <div class="sc"><div class="lbl">With Sends</div><div class="val" style="color:var(--green)">${withSends}</div><div class="sub">${totalSends>=1e6?(totalSends/1e6).toFixed(1)+'M':totalSends>=1000?(totalSends/1000).toFixed(0)+'K':totalSends} total sends</div></div>
  `;
}

function renderTable(){
  filtered.sort((a,b)=>{
    let va=a[sortCol],vb=b[sortCol];
    if(va==null)va=sortDir>0?Infinity:-Infinity;
    if(vb==null)vb=sortDir>0?Infinity:-Infinity;
    if(typeof va==='string')return sortDir*va.localeCompare(vb);
    return sortDir*(va-vb);
  });
  const cols=[
    {key:'name',label:'Campaign Name',w:'280px'},
    {key:'Geo',label:'Geo',w:'80px'},
    {key:'MOps_categorization',label:'Category',w:'140px'},
    {key:'canvas',label:'Canvas',w:'60px'},
    {key:'upstream',label:'Upstream',w:'65px'},
    {key:'dependency',label:'Depend.',w:'60px'},
    {key:'segment_count',label:'Segments',w:'65px'},
    {key:'total_email_sends_2m',label:'Sends 12m',w:'85px'},
  ];
  document.querySelector('#tbl thead').innerHTML='<tr>'+cols.map(c=>{
    const arr=sortCol===c.key?`<span class="sort-arrow">${sortDir>0?'▲':'▼'}</span>`:'';
    return `<th data-col="${c.key}" style="width:${c.w}">${c.label}${arr}</th>`;
  }).join('')+'</tr>';
  document.querySelectorAll('#tbl th').forEach(th=>th.addEventListener('click',()=>{
    const col=th.dataset.col;
    if(sortCol===col)sortDir*=-1; else{sortCol=col;sortDir=col==='name'?1:-1;}
    renderTable();
  }));
  document.querySelector('#tbl tbody').innerHTML=filtered.map(c=>`
    <tr data-id="${c.eloqua_id}" style="cursor:pointer">
      <td class="name-cell">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name||c.eloqua_id}</div>
        ${c.segment_count>1?`<div class="name-sub"><span class="seg-badge">${c.segment_count} segments</span></div>`:''}
      </td>
      <td class="geo-cell">${c.Geo||'-'}</td>
      <td class="cat-cell">${c.MOps_categorization||'<span style="color:var(--text-light)">—</span>'}</td>
      <td style="text-align:center"><span class="pill pill-${c.canvas}">${c.canvas}</span></td>
      <td style="text-align:center"><span class="pill pill-${c.upstream||1}">${c.upstream||'-'}</span></td>
      <td style="text-align:center"><span class="pill pill-${c.dependency||1}">${c.dependency||'-'}</span></td>
      <td style="text-align:center;color:var(--text-muted)">${c.segment_count||0}</td>
      <td class="sends-cell ${c.total_email_sends_2m>0?'sends-pos':''}">${c.total_email_sends_2m?c.total_email_sends_2m.toLocaleString():'<span style="color:var(--text-light)">—</span>'}</td>
    </tr>`).join('');
  document.querySelectorAll('#tbl tbody tr').forEach(tr=>tr.addEventListener('click',()=>{
    const c=filtered.find(x=>String(x.eloqua_id)===tr.dataset.id);
    if(c) showDetail(c);
  }));
}

function showDetail(c){
  const segNames=(c.segment_names||'').split('|').map(s=>s.trim()).filter(Boolean);
  const challenges=P_KEYS.map((k,i)=>`<span class="c-tag ${c[k]?'c-on':'c-off'}">${P_LABELS[i]}</span>`).join('');
  document.getElementById('panel-content').innerHTML=`
    <div class="p-meta" style="margin-bottom:4px">ID: ${c.eloqua_id} · ${c.current_status||'Unknown'}</div>
    <div class="p-name">${c.name}</div>
    <div class="p-meta">${c.Geo||'-'}${c.MOps_categorization?' · '+c.MOps_categorization:''}</div>
    <div class="p-scores">
      <div class="p-score"><div class="pv" style="color:${COLORS[c.canvas]}">${c.canvas}</div><div class="pl">Canvas</div></div>
      <div class="p-score"><div class="pv" style="color:${COLORS[c.upstream||1]}">${c.upstream||'-'}</div><div class="pl">Upstream</div></div>
      <div class="p-score"><div class="pv" style="color:${COLORS[c.dependency||1]}">${c.dependency||'-'}</div><div class="pl">Dependency</div></div>
    </div>
    <div class="p-section">
      <h4>Segment Block (${segNames.length} segment${segNames.length!==1?'s':''})</h4>
      <div class="seg-block">
        ${segNames.map(s=>`<div class="seg-name-item">${s}</div>`).join('')||'<div class="seg-name-item" style="color:var(--text-light)">No segment data</div>'}
      </div>
    </div>
    <div class="p-section">
      <h4>Challenges Triggered (${c.challenges_triggered||0}/12)</h4>
      <div class="c-tags">${challenges}</div>
    </div>
    <div class="p-section">
      <h4>Metrics</h4>
      <div class="p-row"><span class="k">Total elements</span><span class="v">${c.total_elements??'-'}</span></div>
      <div class="p-row"><span class="k">Emails</span><span class="v">${c.emails??'-'}</span></div>
      <div class="p-row"><span class="k">Dependency</span><span class="v" style="color:${COLORS[c.dependency||1]}">${DEP_LABELS[c.dependency||1]}</span></div>
      <div class="p-row"><span class="k">Co-migration campaigns</span><span class="v" style="color:${(c.inst_co_migration_count||0)>10?'var(--orange)':'inherit'}">${c.inst_co_migration_count??'-'}</span></div>
      <div class="p-row"><span class="k">Total sends (12m)</span><span class="v" style="color:${c.total_email_sends_2m>0?'var(--green)':'var(--text-light)'}">${c.total_email_sends_2m?c.total_email_sends_2m.toLocaleString():'None'}</span></div>
    </div>
  `;
  document.getElementById('panel').classList.add('open');
}

document.getElementById('panel-close').addEventListener('click',()=>document.getElementById('panel').classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('panel').classList.remove('open');});
init();
</script>
